name: Release

on:
  push:
    branches: [master]
    # A version bump always touches package.json, so this is a cheap pre-filter.
    # The job below still checks the version itself before publishing anything.
    paths: ['package.json']
  # Lets a partially failed release be finished without another commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Has the version changed?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag_missing: ${{ steps.read.outputs.tag_missing }}
      npm_missing: ${{ steps.read.outputs.npm_missing }}
      release_needed: ${{ steps.read.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Compare package.json against the tags and the registry
        id: read
        run: |
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "tag_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_missing=true" >> "$GITHUB_OUTPUT"
          fi

          # `npm view` exits non-zero when that exact version is not published.
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "npm_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm_missing=true" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
             && npm view "$name@$version" version > /dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already tagged and published; nothing to do."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $name@$version."
          fi

  release:
    name: Release ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the GitHub release
      packages: write   # publish to GitHub Packages
      id-token: write   # npm provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Declared here, not on the steps, because a step's `if` cannot see its own
      # env block. `secrets` is not available in an `if` at all, so this
      # indirection is what lets the npm step be skipped when the token is absent.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Publishing cannot be undone, so the suite gates it rather than being
      # left to the CI workflow on a different event.
      - name: Tests must pass before anything is published
        run: npm test

      # Each step below is guarded separately, so a run that failed halfway can
      # be repeated with workflow_dispatch and will only do what is still missing.
      - name: Tag and create the GitHub release
        if: needs.check.outputs.tag_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag

      - name: Publish to npm
        # NPM_TOKEN has to be added to the repository secrets before this can
        # run. Without it the step is skipped rather than failing the release, so
        # the tag, the GitHub release and the GitHub Packages copy still happen.
        if: needs.check.outputs.npm_missing == 'true' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Say so if the npm token is missing
        if: needs.check.outputs.npm_missing == 'true' && env.NPM_TOKEN == ''
        run: |
          echo "::warning::NPM_TOKEN is not set, so nothing was published to npm."
          echo "Add an automation token at https://www.npmjs.com/settings/~/tokens"
          echo "then: gh secret set NPM_TOKEN --repo ${{ github.repository }}"

      # GitHub Packages only accepts a package whose scope matches the repository
      # owner, and this package is published unscoped on npm. The name is
      # rewritten here for that registry alone; the change lives in the runner's
      # working copy and is never committed, so the npm name is untouched.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@megapixel99'

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scoped="@megapixel99/$(node -p 'require("./package.json").name')"
          if npm view "$scoped@$VERSION" version \
               --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "::notice::$scoped@$VERSION is already on GitHub Packages."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '$scoped';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --registry=https://npm.pkg.github.com
          # Leave the checkout as it was, in case a later step reads the name.
          git checkout -- package.json

      - name: Summary
        run: |
          {
            echo "### Released v$VERSION"
            echo
            echo "- tag and GitHub release: ${{ needs.check.outputs.tag_missing == 'true' && 'created' || 'already existed' }}"
            echo "- npm: https://www.npmjs.com/package/cas-authentication-user/v/$VERSION"
            echo "- GitHub Packages: @megapixel99/cas-authentication-user@$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
