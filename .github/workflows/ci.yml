name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than stopping at the first failure.
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Called directly rather than through `npm test` so that a failing test
      # and a failing type-check are separate lines in the run summary. The glob
      # is unquoted on purpose: the shell expands it, which Node only learned to
      # do itself in v22.
      - name: Tests
        run: node --test test/*.test.js

      - name: Type-check the shipped declarations
        run: npm run typecheck

  package:
    name: Packaged artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # The `files` field decides what consumers actually receive, and nothing in
      # the test suite covers it: a missing entry point only shows up on install.
      - name: Pack and list the tarball
        run: |
          npm pack --pack-destination /tmp
          echo 'Tarball contents:'
          tar -tzf /tmp/cas-authentication-user-*.tgz | sort

      - name: Both entry points must load with production dependencies only
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --omit=dev /tmp/cas-authentication-user-*.tgz
          node -e "
            const CAS = require('cas-authentication-user');
            const Strategy = require('cas-authentication-user/strategy');
            const cas = new CAS({
              cas_url: 'https://cas.example.edu:8443/cas',
              service_url: 'https://app.example.edu',
            });
            const assert = require('node:assert');
            // An explicit port is honoured, and the statics the README documents exist.
            assert.strictEqual(cas.cas_port, 8443);
            assert.strictEqual(CAS.GATEWAY_SESSION_FLAG, 'cas_gateway_attempted');
            assert.strictEqual(CAS.GATEWAY_QUERY_PARAM, 'cas_gateway');
            ['bounce', 'block', 'gateway', 'bounce_redirect', 'login', 'logout']
              .forEach((n) => assert.strictEqual(typeof cas[n], 'function', n));
            assert.strictEqual(new Strategy({ cas }).name, 'cas');
            // xml2js is the only runtime dependency the tarball may rely on.
            const installed = require('fs').readdirSync('node_modules').filter((d) => d[0] !== '.');
            console.log('installed:', installed.join(', '));
            console.log('OK: both entry points load');
          "

      - name: The declaration files must be in the tarball
        run: |
          for f in index.js index.d.ts strategy.js strategy.d.ts; do
            tar -tzf /tmp/cas-authentication-user-*.tgz | grep -qx "package/$f" \
              && echo "present: $f" \
              || { echo "MISSING from tarball: $f"; exit 1; }
          done
